# D1 template families. Each `id` is a template FAMILY, and the train/dev/test
# split is made over families, never over rows -- see packages/nlp/dataset.py.
#
# Placeholders: {booking_type} {origin} {destination} {date} {time} {provider}
#               {booking_ref} {party_size} {relative_ref}
# `origin` and `destination` both draw from the `city` lexicon.
#
# Templates give exact slot offsets for free, which hand-written examples do not.
# What they do NOT give is natural variety: real speech is messier than any
# template set. The LLM paraphrase pass (Phase 2, step 2) exists to fix that, and
# until it runs, treat scores on this data as an optimistic ceiling.

