# --------------------------------------------------------------- confirm (8)
# UC3's confirmation response is itself an utterance the NLP layer must classify.
# Misreading one of these is the worst failure the system can produce, which is
# why confirm and decline are first-class intents rather than a yes/no regex.
- {id: confirm_01, intent: confirm_action, text: "yes go ahead"}
- {id: confirm_02, intent: confirm_action, text: "yes please cancel it"}
- {id: confirm_03, intent: confirm_action, text: "that's correct, do it"}
- {id: confirm_04, intent: confirm_action, text: "yeah that's fine"}
- {id: confirm_05, intent: confirm_action, text: "confirm"}
- {id: confirm_06, intent: confirm_action, text: "go ahead and delete it"}
- {id: confirm_07, intent: confirm_action, text: "ok do that"}
- {id: confirm_08, intent: confirm_action, text: "yes I'm sure"}

