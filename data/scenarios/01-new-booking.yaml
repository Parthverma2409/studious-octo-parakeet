# Family: new_booking -- FR3 (nothing matches) + FR4 (create event + alarm).
# Creation is non-destructive, so every case here must complete with ZERO
# confirmation prompts. A system that asks before every write is as unusable as
# one that never asks.

id: S-101
family: new_booking
use_case: UC1
description: Voice command books a flight; nothing in the calendar matches, so create it.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: voice
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      destination: Chennai
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
      end: 2026-08-20T12:00
      alarm_offset_min: 60
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 1
  decisions: [new_booking]

