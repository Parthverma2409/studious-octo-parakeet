id: S-702
family: conflicting_sources
use_case: UC1
description: >
  The reverse order: email created the event, then the user says a different time out
  loud. The user's correction is gated exactly like the vendor's -- direction of
  disagreement does not change who has to consent.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 10
    type: booking
    source: voice
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T11:00
  - t: 11
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T11:00}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 2
  decisions: [new_booking, reschedule]

