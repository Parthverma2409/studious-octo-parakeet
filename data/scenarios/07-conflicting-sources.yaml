id: S-703
family: conflicting_sources
use_case: UC3
description: >
  The user says "cancel it" while the vendor is still sending confirmations. The
  confirmation is recognised as describing the existing event (a no-op), and the
  pending cancellation is applied only once the user confirms it.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: voice
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 5
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 10
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar: []
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation, duplicate_already_applied]

