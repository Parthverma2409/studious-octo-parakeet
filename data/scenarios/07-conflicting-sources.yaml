# Family: conflicting_sources -- FR3.
# Voice and email disagree about the same booking. The vendor is usually
# authoritative, but "usually" is not a licence to overwrite silently: the change
# still goes through the FR5 gate so the user sees the conflict resolved.

id: S-701
family: conflicting_sources
use_case: UC2
description: >
  The user booked by voice for 09:15; the vendor's email says 10:30. The vendor wins,
  but only after the user confirms the overwrite.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: voice
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 10
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T10:30
  - t: 12
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T10:30}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 2
  decisions: [new_booking, reschedule]

