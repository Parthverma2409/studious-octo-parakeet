# Family: ambiguous_match -- FR3, UC1 open issue.
# When two calendar events are equally plausible, the engine reports the ambiguity
# instead of choosing. Picking one and deleting it is exactly the failure FR5
# exists to prevent, and a 50% chance of destroying the right event is not a
# feature. Every case here asserts zero mutations.

id: S-601
family: ambiguous_match
use_case: UC1
description: Two flights to the same city on the same day; a spoken cancellation names neither.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight to Chennai morning
    type: flight
    start: 2026-08-20T09:15
  - id: E2
    title: Flight to Chennai evening
    type: flight
    start: 2026-08-20T19:15
events:
  - t: 0
    type: booking
    source: voice
    booking:
      type: flight
      status: cancelled
      title: Flight to Chennai
      destination: Chennai
      datetime: 2026-08-20T12:00
expect:
  final_calendar:
    - {title: Flight to Chennai morning, start: 2026-08-20T09:15}
    - {title: Flight to Chennai evening, start: 2026-08-20T19:15}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 0
  decisions: [ambiguous_match]

