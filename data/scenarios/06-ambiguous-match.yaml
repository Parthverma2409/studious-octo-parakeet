id: S-606
family: ambiguous_match
use_case: UC2
description: >
  A weak candidate (same start time, destination word in common) competes with a
  strong one (exact title). The stronger match wins outright rather than the pair
  being declared ambiguous -- over-reporting ambiguity would make the agent useless.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Trip to Chennai
    type: flight
    start: 2026-08-20T09:15
  - id: E2
    title: Flight AI440 BLR to MAA
    type: flight
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      destination: Chennai
      datetime: 2026-08-20T09:15
  - t: 2
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {title: Trip to Chennai, start: 2026-08-20T09:15}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation]
