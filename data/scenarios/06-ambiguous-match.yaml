id: S-602
family: ambiguous_match
use_case: UC1
description: >
  Two appointments with the same provider on the same day. A reschedule cannot say
  which one moved, so neither is touched.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Dentist checkup Dr Rao
    type: appointment
    start: 2026-08-22T10:00
  - id: E2
    title: Dentist checkup Dr Rao
    type: appointment
    start: 2026-08-22T17:30
events:
  - t: 0
    type: booking
    source: voice
    booking:
      type: appointment
      status: rescheduled
      title: Dentist checkup Dr Rao
      provider: Dr Rao
      datetime: 2026-08-22T19:00
expect:
  final_calendar:
    - {title: Dentist checkup Dr Rao, start: 2026-08-22T10:00}
    - {title: Dentist checkup Dr Rao, start: 2026-08-22T17:30}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 0
  decisions: [ambiguous_match]

