id: S-603
family: ambiguous_match
use_case: UC2
description: >
  The same two look-alike events, but the cancellation carries a vendor reference.
  Tier-1 matching resolves what fuzzy matching could not -- ambiguity is a fallback
  problem, not an inherent one.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight to Chennai
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
  - id: E2
    title: Flight to Chennai
    type: flight
    booking_ref: AI772-ZZ88
    start: 2026-08-20T19:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight to Chennai
      booking_ref: AI772-ZZ88
      datetime: 2026-08-20T19:15
  - t: 2
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation]

