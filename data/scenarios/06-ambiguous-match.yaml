id: S-604
family: ambiguous_match
use_case: UC2
description: >
  Two events share a title but differ in booking type. The type filter disambiguates
  them, so this resolves to a normal gated cancellation rather than a stalemate.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Trip to Chennai
    type: flight
    start: 2026-08-20T09:15
  - id: E2
    title: Trip to Chennai
    type: hotel
    start: 2026-08-20T15:00
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Trip to Chennai
      datetime: 2026-08-20T09:15
  - t: 2
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {title: Trip to Chennai, start: 2026-08-20T15:00}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation]

