# Family: partial_input -- UC2 E1.
# "The email cannot be parsed into structured fields -- the system leaves the
# calendar untouched and flags the item for manual review."
# The failure mode being guarded against is a confident guess from thin data.

id: S-801
family: partial_input
use_case: UC2
description: An itinerary attached as a PDF with no date in the body -- unparseable, calendar untouched.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: unparseable
    note: "Itinerary attached as a PDF; body carries no date or reference"
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 0
  decisions: [unparseable]

