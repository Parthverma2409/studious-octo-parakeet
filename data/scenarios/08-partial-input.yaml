id: S-805
family: partial_input
use_case: UC3
description: >
  An unparseable email arrives while a destructive confirmation is pending. It must
  not disturb the open request, and the user's later "yes" must still apply to the
  cancellation they were actually asked about.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 2
    type: unparseable
    note: "Unrelated vendor mail in an unsupported template"
  - t: 4
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar: []
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation, unparseable]
