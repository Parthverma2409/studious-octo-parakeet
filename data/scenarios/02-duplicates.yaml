# Family: duplicate_notification -- NFR2.
# "Matching shall be idempotent under repeated notifications of the same change."
# The assertion that matters here is `mutations`: repeating a notification must
# not add a second calendar write or raise a second prompt. Two calendars can
# look identical while one got there by writing three times -- that is the failure.

id: S-201
family: duplicate_notification
use_case: UC2
description: The same confirmation email is delivered twice; the second must be a no-op.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 30
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 1
  decisions: [new_booking, duplicate_already_applied]

