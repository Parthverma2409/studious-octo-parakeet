id: S-503
family: out_of_order
use_case: UC2
description: >
  A reschedule arrives after the booking was already cancelled and removed. It is
  re-created rather than discarded: the vendor is asserting the trip is live again,
  and a silent drop would leave the user with no calendar entry for a real flight.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 2
    type: user_confirm
    request: 1
    confirmed: true
  - t: 30
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T16:30
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T16:30}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 2
  decisions: [cancellation, new_booking]

