# Family: out_of_order -- FR3.
# Email does not arrive in the order it was sent. Every case here is a real
# ordering hazard, and in each the safe answer is to end in a state the user can
# see and correct, never to silently resurrect or silently drop a trip.

id: S-501
family: out_of_order
use_case: UC2
description: >
  The cancellation arrives before the confirmation that created the booking. The late
  confirmation must not be swallowed -- it becomes a visible booking the user can act on.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 5
    type: booking
    source: email
    booking:
      type: flight
      status: confirmed
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 1
  decisions: [already_cancelled, new_booking]

---

id: S-502
family: out_of_order
use_case: UC2
description: >
  A reschedule notice arrives for a booking the calendar never had. There is nothing
  to overwrite, so it is created rather than dropped -- and creation needs no prompt.
now: 2026-08-18T08:00
initial_calendar: []
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T14:45
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T14:45}
  confirmations_requested: 0
  destructive_without_confirm: 0
  mutations: 1
  decisions: [new_booking]

