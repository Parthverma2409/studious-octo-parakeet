id: S-505
family: out_of_order
use_case: UC3
description: >
  A reschedule arrives while a cancellation for the same booking is still awaiting an
  answer. Current behaviour: the pending request suppresses the second prompt, and
  answering "yes" applies the CANCELLATION, not the reschedule.
  KNOWN LIMITATION -- the prompt the user answered may no longer describe the latest
  vendor state. Safe (nothing happens without consent) but potentially confusing.
  Tracked as an open issue; the fix is to supersede a pending request when a newer
  conflicting change arrives for the same reference.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 5
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T14:45
  - t: 10
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar: []
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation, reschedule]
