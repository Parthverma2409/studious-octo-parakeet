# Family: cancellation -- FR4, FR5, UC3.
# S-401 is the sequence diagram from the design document, replayed end to end.

id: S-401
family: cancellation
use_case: UC2
description: >
  The design document's sequence diagram, end to end: a cancellation email arrives,
  the engine raises a ConfirmationRequest, the traveller confirms, the event is
  deleted, the alarm is cancelled and the interaction is logged.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
    alarm_offset_min: 60
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: cancelled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T09:15
  - t: 3
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar: []
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation]
  confirmation_statuses: [confirmed]

