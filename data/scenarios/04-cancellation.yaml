id: S-404
family: cancellation
use_case: UC2
description: >
  One of two bookings is cancelled. The correct event must be removed and the other
  left completely alone -- deleting the wrong trip is the worst outcome this system
  can produce.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
  - id: E2
    title: Taj Coromandel Chennai
    type: hotel
    booking_ref: TAJ-99871
    start: 2026-08-20T15:00
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: hotel
      status: cancelled
      title: Taj Coromandel Chennai
      booking_ref: TAJ-99871
      datetime: 2026-08-20T15:00
  - t: 2
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [cancellation]

