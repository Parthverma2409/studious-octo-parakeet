id: S-308
family: reschedule
use_case: UC3
description: >
  The user declines a reschedule, then the vendor sends it again. A declined request
  must NOT suppress the new prompt -- suppression is for requests still awaiting an
  answer, and treating "no" as permanent would hide a real change.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T14:45
  - t: 1
    type: user_confirm
    request: 1
    confirmed: false
  - t: 5
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T14:45
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T09:15}
  confirmations_requested: 2
  destructive_without_confirm: 0
  mutations: 0
  confirmation_statuses: [declined, pending]
