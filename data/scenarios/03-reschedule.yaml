# Family: reschedule -- FR3, FR4, FR5.
# A reschedule overwrites the time of an event the user is relying on, so it is
# destructive and gated exactly like a deletion.

id: S-301
family: reschedule
use_case: UC2
description: Airline moves the flight five hours later; the user confirms the overwrite.
now: 2026-08-18T08:00
initial_calendar:
  - id: E1
    title: Flight AI440 BLR to MAA
    type: flight
    booking_ref: AI440-XY12
    start: 2026-08-20T09:15
    end: 2026-08-20T12:00
    alarm_offset_min: 60
events:
  - t: 0
    type: booking
    source: email
    booking:
      type: flight
      status: rescheduled
      title: Flight AI440 BLR to MAA
      booking_ref: AI440-XY12
      datetime: 2026-08-20T14:45
      end: 2026-08-20T17:30
  - t: 10
    type: user_confirm
    request: 1
    confirmed: true
expect:
  final_calendar:
    - {booking_ref: AI440-XY12, start: 2026-08-20T14:45}
  confirmations_requested: 1
  destructive_without_confirm: 0
  mutations: 1
  decisions: [reschedule]

